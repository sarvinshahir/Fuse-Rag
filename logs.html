<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuse AI — Evaluation Console</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #F7F8FA; --panel: #FFFFFF; --accent: #0066CC; --accent-light: #E8F0FB;
    --text: #1A1A2E; --text-muted: #6B7280; --border: #E5E7EB;
    --good: #10B981; --good-light: #E7F7F0; --bad: #EF4444; --bad-light: #FDECEC;
    --warn: #B45309; --warn-light: #FEF3C7; --shadow: 0 4px 16px rgba(0,0,0,0.12);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text); height: 100vh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    padding: 14px 24px; background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 14px; flex-shrink: 0; flex-wrap: wrap;
  }
  .logo-icon {
    width: 32px; height: 32px; background: var(--accent); border-radius: 8px;
    display: flex; align-items: center; justify-content: center; font-size: 17px;
  }
  header h1 { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }
  header .sub { font-size: 11px; color: var(--text-muted); }
  .spacer { flex: 1; }
  .stat { font-size: 12px; color: var(--text-muted); }
  .stat b { color: var(--text); font-size: 14px; }

  .toolbar {
    padding: 12px 24px; background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap; flex-shrink: 0;
  }
  input, select, textarea {
    font-family: inherit; font-size: 13px; color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; outline: none; background: white;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  .search-box { flex: 1; min-width: 200px; }
  .btn {
    padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer;
    border: 1px solid var(--border); background: white; color: var(--text); font-weight: 500;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
  .btn.primary:hover { background: #0052A3; color: white; }

  .list { flex: 1; overflow-y: auto; padding: 16px 24px 48px; }

  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    margin-bottom: 12px; overflow: hidden;
  }
  .card-head {
    padding: 12px 16px; display: flex; gap: 10px; align-items: flex-start; cursor: pointer;
  }
  .card-head:hover { background: #FBFCFE; }
  .q { flex: 1; min-width: 0; }
  .q .question { font-size: 14px; font-weight: 600; line-height: 1.4; }
  .q .meta { font-size: 11px; color: var(--text-muted); margin-top: 4px; display: flex; gap: 10px; flex-wrap: wrap; }
  .q .meta .who { color: var(--accent); font-weight: 600; text-transform: capitalize; }
  .badges { display: flex; gap: 6px; align-items: center; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
  .pill { font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 10px; white-space: nowrap; }
  .pill.reviewed { background: var(--good-light); color: var(--good); }
  .pill.unreviewed { background: var(--warn-light); color: var(--warn); }
  .pill.up { background: var(--good-light); color: var(--good); }
  .pill.down { background: var(--bad-light); color: var(--bad); }
  .pill.model { background: var(--accent-light); color: var(--accent); }
  .pill.lat { background: #F3F4F6; color: var(--text-muted); }
  .caret { color: var(--text-muted); font-size: 12px; transition: transform 0.15s; margin-top: 2px; }
  .card.open .caret { transform: rotate(90deg); }

  .card-body { display: none; padding: 0 16px 16px; border-top: 1px solid var(--border); }
  .card.open .card-body { display: block; }
  .section { margin-top: 14px; }
  .section-label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .answer-text { font-size: 13px; line-height: 1.6; white-space: pre-wrap; background: #FBFCFE; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .chunk {
    font-size: 12px; line-height: 1.5; background: #FBFCFE; border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; margin-bottom: 6px;
  }
  .chunk .chunk-meta { font-size: 10px; color: var(--text-muted); margin-bottom: 4px; display: flex; gap: 10px; flex-wrap: wrap; }
  .chunk .chunk-meta b { color: var(--accent); }
  .chunk .chunk-text { white-space: pre-wrap; max-height: 120px; overflow-y: auto; }
  .eval-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-top: 8px; }
  .eval-row .grow { flex: 1; min-width: 240px; }
  textarea.expected { width: 100%; min-height: 70px; resize: vertical; }
  .save-note { font-size: 12px; color: var(--good); margin-left: 8px; }
  .empty { text-align: center; color: var(--text-muted); padding: 60px 20px; font-size: 14px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
</head>
<body>

<header>
  <div class="logo-icon">⚡</div>
  <div>
    <h1>Evaluation Console</h1>
    <div class="sub">Fuse AI Knowledge Assistant — conversation logs</div>
  </div>
  <div class="spacer"></div>
  <div class="stat"><b id="stat-total">0</b> records</div>
  <div class="stat"><b id="stat-reviewed">0</b> reviewed</div>
  <div class="stat"><b id="stat-down">0</b> 👎</div>
</header>

<div class="toolbar">
  <input class="search-box" id="search" placeholder="Search questions, answers, users…" oninput="render()">
  <select id="filter-user" onchange="render()"><option value="">All users</option></select>
  <select id="filter-status" onchange="render()">
    <option value="">All statuses</option>
    <option value="unreviewed">Unreviewed</option>
    <option value="reviewed">Reviewed</option>
  </select>
  <select id="filter-feedback" onchange="render()">
    <option value="">All feedback</option>
    <option value="up">👍 Up</option>
    <option value="down">👎 Down</option>
    <option value="none">No feedback</option>
  </select>
  <button class="btn" onclick="load()">↻ Refresh</button>
  <div class="spacer"></div>
  <button class="btn primary" onclick="exportData('jsonl')">⬇ JSONL</button>
  <button class="btn primary" onclick="exportData('csv')">⬇ CSV</button>
</div>

<div class="list" id="list">
  <div class="empty">Loading…</div>
</div>

<script>
const API = '';  // served from the same origin at /admin
let rows = [];
const openIds = new Set();

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function parseJSON(v, fallback) {
  if (Array.isArray(v) || (v && typeof v === 'object')) return v;
  try { return JSON.parse(v); } catch (e) { return fallback; }
}

async function load() {
  document.getElementById('list').innerHTML = '<div class="empty">Loading…</div>';
  try {
    const res = await fetch(`${API}/logs`, { credentials: 'include' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    rows = data.conversations || [];
    populateUsers();
    render();
  } catch (e) {
    document.getElementById('list').innerHTML =
      `<div class="empty">Could not load logs (${esc(e.message)}).<br>Make sure you're signed in as the admin user.</div>`;
  }
}

function populateUsers() {
  const sel = document.getElementById('filter-user');
  const current = sel.value;
  const users = [...new Set(rows.map(r => r.username).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">All users</option>' +
    users.map(u => `<option value="${esc(u)}">${esc(u)}</option>`).join('');
  sel.value = current;
}

function updateStats(filtered) {
  document.getElementById('stat-total').textContent = rows.length;
  document.getElementById('stat-reviewed').textContent =
    rows.filter(r => r.evaluation_status === 'reviewed').length;
  document.getElementById('stat-down').textContent =
    rows.filter(r => r.user_feedback === 'down').length;
}

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const fUser = document.getElementById('filter-user').value;
  const fStatus = document.getElementById('filter-status').value;
  const fFb = document.getElementById('filter-feedback').value;

  const filtered = rows.filter(r => {
    if (fUser && r.username !== fUser) return false;
    if (fStatus && (r.evaluation_status || 'unreviewed') !== fStatus) return false;
    if (fFb === 'none' && r.user_feedback) return false;
    if (fFb && fFb !== 'none' && r.user_feedback !== fFb) return false;
    if (q) {
      const hay = `${r.question || ''} ${r.answer || ''} ${r.username || ''} ${r.rewritten_query || ''}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  updateStats(filtered);
  const list = document.getElementById('list');
  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">No matching conversations.</div>';
    return;
  }
  list.innerHTML = filtered.map(renderCard).join('');
}

function renderCard(r) {
  const open = openIds.has(r.id);
  const status = r.evaluation_status || 'unreviewed';
  const fb = r.user_feedback;
  const chunks = parseJSON(r.retrieved_chunks, []);
  const sourceFiles = parseJSON(r.source_files, []);
  const when = (r.timestamp || '').replace('T', ' ').split('.')[0];

  const fbPill = fb === 'up' ? '<span class="pill up">👍</span>'
    : fb === 'down' ? '<span class="pill down">👎</span>' : '';
  const latPill = r.latency_ms != null ? `<span class="pill lat">${r.latency_ms} ms</span>` : '';
  const modelPill = r.model ? `<span class="pill model">${esc(r.model)}</span>` : '';

  const chunkHtml = chunks.length ? chunks.map(c => `
    <div class="chunk">
      <div class="chunk-meta">
        <span>#${esc(c.rank)}</span>
        <span><b>${esc(c.filename)}</b></span>
        <span>score: ${c.score == null ? '—' : Number(c.score).toFixed(4)}</span>
        <span class="mono">${esc(c.folder_path)}</span>
      </div>
      <div class="chunk-text">${esc(c.text)}</div>
    </div>`).join('') : '<div class="chunk">No chunks retrieved (conversational or no-results turn).</div>';

  return `
  <div class="card ${open ? 'open' : ''}" data-id="${r.id}">
    <div class="card-head" onclick="toggle(${r.id})">
      <span class="caret">▶</span>
      <div class="q">
        <div class="question">${esc(r.question)}</div>
        <div class="meta">
          <span class="who">${esc(r.username)}</span>
          <span>${esc(when)}</span>
          ${sourceFiles.length ? `<span>📄 ${sourceFiles.length} file(s)</span>` : ''}
          <span class="mono">#${r.id}</span>
        </div>
      </div>
      <div class="badges">
        ${fbPill}${modelPill}${latPill}
        <span class="pill ${status}">${esc(status)}</span>
      </div>
    </div>
    <div class="card-body">
      ${r.rewritten_query && r.rewritten_query !== r.question ? `
      <div class="section">
        <div class="section-label">Rewritten query (sent to retrieval)</div>
        <div class="answer-text">${esc(r.rewritten_query)}</div>
      </div>` : ''}

      <div class="section">
        <div class="section-label">Generated answer</div>
        <div class="answer-text">${esc(r.answer)}</div>
      </div>

      ${r.feedback_comment ? `
      <div class="section">
        <div class="section-label">User feedback comment</div>
        <div class="answer-text">${esc(r.feedback_comment)}</div>
      </div>` : ''}

      <div class="section">
        <div class="section-label">Retrieved chunks (${chunks.length})</div>
        ${chunkHtml}
      </div>

      <div class="section">
        <div class="section-label">Ground truth — expected answer</div>
        <textarea class="expected" id="exp-${r.id}" placeholder="Write the ideal answer for evaluation…">${esc(r.expected_answer || '')}</textarea>
        <div class="eval-row">
          <div>
            <div class="section-label">Status</div>
            <select id="status-${r.id}">
              <option value="unreviewed" ${status === 'unreviewed' ? 'selected' : ''}>unreviewed</option>
              <option value="reviewed" ${status === 'reviewed' ? 'selected' : ''}>reviewed</option>
            </select>
          </div>
          <button class="btn primary" onclick="saveEval(${r.id})">Save</button>
          <span class="save-note" id="note-${r.id}"></span>
        </div>
      </div>
    </div>
  </div>`;
}

function toggle(id) {
  if (openIds.has(id)) openIds.delete(id); else openIds.add(id);
  const card = document.querySelector(`.card[data-id="${id}"]`);
  if (card) card.classList.toggle('open');
}

async function saveEval(id) {
  const expected = document.getElementById(`exp-${id}`).value;
  const statusVal = document.getElementById(`status-${id}`).value;
  const note = document.getElementById(`note-${id}`);
  note.textContent = 'Saving…';
  note.style.color = 'var(--text-muted)';
  try {
    const res = await fetch(`${API}/evaluate`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({
        conversation_id: id,
        expected_answer: expected,
        evaluation_status: statusVal
      })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const row = rows.find(r => r.id === id);
    if (row) { row.expected_answer = expected; row.evaluation_status = statusVal; }
    note.textContent = '✓ Saved';
    note.style.color = 'var(--good)';
    updateStats();
    // Update just this card's status pill without collapsing it.
    const pill = document.querySelector(`.card[data-id="${id}"] .pill.${statusVal === 'reviewed' ? 'unreviewed' : 'reviewed'}`);
    if (pill) { pill.classList.remove('reviewed', 'unreviewed'); pill.classList.add(statusVal); pill.textContent = statusVal; }
    setTimeout(() => { note.textContent = ''; }, 2500);
  } catch (e) {
    note.textContent = '✗ ' + e.message;
    note.style.color = 'var(--bad)';
  }
}

async function exportData(format) {
  try {
    const res = await fetch(`${API}/logs/export?format=${format}`, { credentials: 'include' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const stamp = new Date().toISOString().slice(0, 10);
    a.download = `fuse_eval_dataset_${stamp}.${format}`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch (e) {
    alert('Export failed: ' + e.message);
  }
}

load();
</script>
</body>
</html>
